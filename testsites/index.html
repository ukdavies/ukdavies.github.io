<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test sites · Andy Davies</title>
<link rel="icon" href="../mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F1828; --card: rgba(255,255,255,0.035); --card-hover: rgba(255,255,255,0.07);
  --line: rgba(255,255,255,0.09); --line-hover: rgba(159,203,184,0.45);
  --ink: #F4F2EC; --body: #B7C0CD; --muted: #7D8899; --sage: #9FCBB8;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--body); font: 16px/1.6 var(--font); }
.wrap { max-width: 980px; margin: 0 auto; padding: 64px 28px; }
h1 { margin: 0; color: var(--ink); font-size: clamp(34px, 5vw, 48px); font-weight: 800; letter-spacing: -0.03em; }
.lede { margin: 14px 0 40px; max-width: 640px; }
.list { display: grid; gap: 14px; }
.site { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: center;
  padding: 22px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.site h2 { margin: 0; color: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.site .links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14.5px; }
.site a { color: var(--sage); text-underline-offset: 3px; overflow-wrap: anywhere; }
.site a.live { color: var(--muted); }
.site .repo { font-size: 13px; color: var(--muted); }
footer { margin-top: 40px; font-size: 13.5px; color: var(--muted); }
footer a { color: var(--body); }
@media (max-width: 600px) { .site { grid-template-columns: 1fr; } }
.unlock { max-width: 420px; }
.unlock label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--ink); }
.unlock-row { display: flex; gap: 10px; }
.unlock input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.unlock input:focus { outline: 2px solid var(--sage); outline-offset: 1px; }
.unlock button { font: 600 15px var(--font); color: var(--bg); background: var(--sage); border: 0; border-radius: 12px; padding: 0 22px; cursor: pointer; }
.pw-msg { min-height: 1.6em; margin: 10px 0 0; font-size: 14px; color: #F2A7A7; }
</style>
</head>
<body>
<main class="wrap">
  <h1>Test sites</h1>
  <p class="lede">Working copies of my sites, used to try changes before they go live. They're hidden from search engines and not linked from anywhere else.</p>

  <form id="unlock" class="unlock" autocomplete="off">
    <label for="pw">Password</label>
    <div class="unlock-row"><input id="pw" type="password" autocomplete="current-password" required autofocus><button type="submit">Open</button></div>
    <p id="pw-msg" class="pw-msg" role="status" aria-live="polite"></p>
  </form>
  <div id="content" hidden></div>

    var u = function (x) { return Uint8Array.from(atob(x), function (c) { return c.charCodeAt(0); }); };
    function open(pw) {
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
        .then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(D.salt), iterations: D.it, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
        .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(D.iv) }, key, u(D.ct)); })
        .then(function (buf) {
          var c = document.getElementById('content');
          c.innerHTML = new TextDecoder().decode(buf); c.hidden = false;
          document.getElementById('unlock').hidden = true;
          try { sessionStorage.setItem('ts-pw', pw); } catch (e) {}
        });
    }
    var f = document.getElementById('unlock'), msg = document.getElementById('pw-msg');
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.textContent = '';
      open(document.getElementById('pw').value).catch(function () { msg.textContent = 'That password is not right.'; document.getElementById('pw').select(); });
